name: Deploy portfolio to GitHub Pages
# Fresh workflow run avoids duplicate artifacts created by rerunning a failed deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare self-hosted PDF.js
        run: |
          set -euo pipefail

          # Keep the viewer pinned to a widely compatible known-good release.
          # Updating this version is an intentional maintenance change, not a runtime dependency.
          PDFJS_VERSION="3.11.174"

          mkdir -p pdfjs
          npm pack "pdfjs-dist@${PDFJS_VERSION}" --pack-destination "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/pdfjs-dist-${PDFJS_VERSION}.tgz" -C "${RUNNER_TEMP}"

          cp "${RUNNER_TEMP}/package/build/pdf.mjs" pdfjs/pdf.mjs
          cp "${RUNNER_TEMP}/package/build/pdf.worker.mjs" pdfjs/pdf.worker.mjs

          test -s pdfjs/pdf.mjs
          test -s pdfjs/pdf.worker.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
